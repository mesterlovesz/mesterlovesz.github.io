name: Mesterlövész weboldal
on:
  push:
    branches: [main]
    paths: ['site/**', 'web-upload-04.zip']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Első feltöltés kibontása
        if: hashFiles('web-upload-*.zip') != ''
        run: |
          python3 - <<'PY'
          import glob, pathlib, zipfile
          root = pathlib.Path.cwd().resolve()
          for bundle in sorted(glob.glob('web-upload-*.zip')):
              with zipfile.ZipFile(bundle) as archive:
                  for entry in archive.infolist():
                      target = (root / entry.filename).resolve()
                      if not target.is_relative_to(root) or '.git' in pathlib.PurePosixPath(entry.filename).parts:
                          raise RuntimeError('Érvénytelen csomagútvonal')
                  archive.extractall(root)
          PY
          git rm -- web-upload-*.zip
          git add -A -f -- .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish website and Kiskina research archive'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
